name: Reproduction or first-run report
description: Report a wrong result, setup failure, or confusing first run.
title: "[Report] "
body:
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: Was this your first run, and which step blocked you?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Revision and environment
      description: Include commit, OS, Python and OpenCV versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Exact command, expected result, actual JSON and exit code
      description: Remove private paths or secrets. A synthetic reproducer is ideal.
      render: text
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Optional media provenance
      description: Only attach material you may share. State synthetic versus real footage and the intended motion; sharing a private video is not required.
  - type: textarea
    id: outcome
    attributes:
      label: Optional first-use outcome
      description: Did the documented demo run without help? Did you use the result in an actual task? These are observations, not requests for a star.
